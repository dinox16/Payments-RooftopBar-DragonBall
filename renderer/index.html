<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Tính lương</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="side">
    <div class="brand">
      <div class="logo">₫</div>
      <div><b>Tính lương</b><small>Quán · T6 – CN</small></div>
    </div>
    <nav>
      <button data-view="week" class="active"><span class="ico">▦</span>Tuần lương</button>
      <button data-view="employees"><span class="ico">☺</span>Nhân viên</button>
      <button data-view="history"><span class="ico">↺</span>Lịch sử</button>
      <button data-view="settings"><span class="ico">⚙</span>Cài đặt</button>
    </nav>
    <div class="side-foot" id="appInfo"></div>
  </aside>
  <main id="main"></main>
  <div id="updateBar" class="updatebar" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <dialog id="dlg"></dialog>
  <script src="app.js"></script>
</body>
</html>
